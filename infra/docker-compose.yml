version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: smb_agent_postgres
    environment:
      POSTGRES_USER: smb_admin
      POSTGRES_PASSWORD: smb_secure_password_2026
      POSTGRES_DB: smb_agent_os
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smb_admin -d smb_agent_os"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: smb_agent_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
